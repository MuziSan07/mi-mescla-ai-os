[project]
name = "ai-os"
description = "AI Operating System — multi-agent orchestration platform"
version = "1.0.0"
authors = [
    { name = "Ali Basit" }
]
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.22",

    # Auth & security
    "python-jose==3.5.0",
    "cryptography==46.0.5",
    "bcrypt==5.0.0",
    "PyJWT[crypto]==2.11.0",
    "authlib==1.6.10",

    # HTTP
    "httpx==0.28.1",
    "aiohttp==3.13.5",
    "requests==2.33.1",

    # Data / storage
    "redis==7.4.0",
    "aiofiles==25.1.0",

    # Utilities
    "psutil",
    "loguru==0.7.3",
]

[project.optional-dependencies]
standard = [
    "uvicorn[standard]",
]
# Optional integrations — imported lazily; the core app runs without them.
integrations = [
    "qdrant-client",   # vector memory  (ai_os/utils/qdrant_integration.py)
    "playwright",      # browser engine (ai_os/browser/engine.py)
    "pika",            # RabbitMQ checks (ai_os/utils/runtime_validator.py)
]
# Voice layer (Phase 2) — local speech-to-text + text-to-speech.
voice = [
    "faster-whisper",  # speech -> text (ai_os/core/voice/stt.py)
    "piper-tts",       # text -> speech, female voice (ai_os/core/voice/tts.py)
]
# Wake word (Phase 2b) — hands-free "always listening" daemon.
wake = [
    "openwakeword",    # local wake-word detection (ai_os/voice_daemon.py)
    "sounddevice",     # mic capture + playback (needs system PortAudio)
    "numpy",
]
# Optional Conductor backends (Phase 6) — pluggable multi-agent frameworks.
frameworks = [
    "crewai",          # role-based agent crews
    "langgraph",       # graph / state-machine flows
    "pyautogen",       # Microsoft AutoGen
]
# Native C++ accelerator build tool (Phase 8) — then `pip install ./native`.
native = [
    "pybind11",        # builds native/aios_native.cpp (fast tokenizer)
]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "httpx",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
