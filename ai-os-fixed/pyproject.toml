[project]
name = "ai-os"
description = "AI Operating System — multi-agent orchestration platform"
version = "1.0.0"
authors = [{ name = "AI-OS Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.22",
    "python-jose==3.5.0",
    "cryptography==46.0.5",
    "bcrypt==5.0.0",
    "PyJWT[crypto]==2.11.0",
    "authlib==1.6.10",
    "httpx==0.28.1",
    "aiohttp==3.13.5",
    "requests==2.33.1",
    "redis==7.4.0",
    "aiofiles==25.1.0",
    "psutil",
    "loguru==0.7.3",
]

[project.optional-dependencies]
standard = ["uvicorn[standard]"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.24.0", "httpx"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
